[project]
name = "sentinel-monitor"
version = "0.1.3"
description = "A fast, minimal CLI tool to monitor website uptime and SSL certificate health."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "blessed>=1.42.0",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Development Status :: 4 - Beta",
]

[dependency-groups]
dev = [
    "ruff==0.17.5",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]

[project.scripts]
sentinel = "monitor.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv]
package = true
