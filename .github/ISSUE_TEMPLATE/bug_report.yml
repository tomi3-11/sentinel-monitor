name: Bug report
description: Report a reproducible problem with Sentinel Monitor.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues before submitting. Do not include passwords, tokens, private keys, or real webhook URLs.
  - type: input
    id: version
    attributes:
      label: Sentinel version
      description: "Output of `sentinel --version`."
      placeholder: "sentinel 0.1.5"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "Python 3.13"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Arch Linux, Ubuntu 24.04, Windows 11..."
    validations:
      required: true
  - type: dropdown
    id: install_method
    attributes:
      label: Installation method
      options:
        - uv tool
        - pip
        - Source checkout
        - Docker
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the exact command and a minimal configuration with secrets removed.
      placeholder: |
        1. Run ...
        2. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Remove sensitive information before pasting logs.
      render: shell
    validations:
      required: false
